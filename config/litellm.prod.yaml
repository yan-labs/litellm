general_settings:
  # Master key MUST come from the runtime env (LITELLM_MASTER_KEY), not a literal.
  # The AgentCore LLM Gateway authenticates to this proxy with that same env key to
  # mint per-session virtual keys; a literal here that differs from the env key makes
  # the proxy reject the gateway key (401 token_not_found) and breaks all AgentCore chat.
  # Keeping it as an env reference also avoids committing the real master key to the repo.
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: true
