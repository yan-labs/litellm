general_settings:
  # Master key from runtime env (LITELLM_MASTER_KEY), not a literal — the AgentCore LLM
  # Gateway authenticates with that same env key to mint virtual keys; a divergent literal
  # makes the proxy reject the gateway key (401 token_not_found). Also keeps the real key
  # out of the repo.
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: true
litellm_settings:
  drop_params: true
  callbacks: ["s3_v2"]
  cold_storage_custom_logger: s3_v2
  s3_callback_params:
    s3_bucket_name: seeds-test-tokyo-artifacts
    s3_region_name: ap-northeast-1
    s3_path: litellm-test/request-logs

